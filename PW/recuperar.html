<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#80461B;
      color:white;
    }

    .topbar{
      background:#5f381a;
      height:70px;

      display:flex;
      align-items:center;

      padding:0 25px;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#f54500;
    }

    .left{
      display:flex;
      align-items:center;
    }

    .nav-links{
      display:flex;
      gap:35px;
      margin-left:30px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:20px;
      transition:0.2s;
    }

    .nav-links a:hover{
      color:#ec9a01;
    }

    .nav-links a.active{
      color:#ec9a01;
      text-decoration:underline;
    }

    .container{
      display:flex;
      justify-content:center;
      margin-top:60px;
    }

    .big-card{
      background:#5f381a;

      width:700px;
      height:450px;

      border-radius:15px;

      display:flex;
      justify-content:center;
      align-items:center;

      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    .recover-card{
      background:#382b1b;

      width:400px;
      padding:35px;

      border-radius:10px;

      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .recover-card h2{
      text-align:center;
    }

    .recover-card p{
      text-align:center;
      color:#c7d5e0;
      font-size:14px;
    }

    .recover-card input{
      padding:14px;

      border:none;
      outline:none;

      border-radius:5px;

      background:#5e462a;
      color:white;

      font-size:16px;
    }

    .recover-card button{
      padding:14px;

      border:none;
      border-radius:5px;

      background:#b8804c;
      color:white;

      font-size:16px;

      cursor:pointer;
    }

  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">STOAM</div>
    <div class="nav-links">
        <a href="#">TIENDA</a>
        <a href="#">BIBLIOTECA</a>
        <a href="perfil.html">PERFIL</a>
      </div>
  </div>

  <div class="container">

    <div class="big-card">

      <div class="recover-card">

        <h2>Recuperar contraseña</h2>

        <p>
          Ingresa tu correo electrónico para recuperar tu cuenta.
        </p>

        <input type="email" placeholder="Correo electrónico">

        <button>Enviar correo</button>

      </div>

    </div>

  </div>

</body>
</html>
