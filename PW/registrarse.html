<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#80461B;
      color:white;
    }

    /* BARRA SUPERIOR */

    .topbar{
      background:#5f381a;
      height:70px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 25px;

      border-bottom:1px solid #80461B;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#f54500;
    }

    .left{
      display:flex;
      align-items:center;
    }

    .nav-links{
      display:flex;
      gap:35px;
      margin-left:30px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:20px;
      transition:0.2s;
    }

    .nav-links a:hover{
      color:#ec9a01;
    }

    .nav-links a.active{
      color:#ec9a01;
      text-decoration:underline;
    }

    /* BUSCADOR */

    .search-area{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .search-box{
      background:#5e462a;
      border:none;
      outline:none;

      padding:12px 15px;
      width:280px;

      color:white;
      border-radius:3px;
      font-size:15px;
    }

    .search-btn{
      background:#b8804c;
      border:none;

      color:white;

      width:45px;
      height:45px;

      border-radius:3px;

      cursor:pointer;
      font-size:18px;
    }

    /* REGISTER */

    .register-container{
      display:flex;
      justify-content:center;
      margin-top:60px;
    }

    .big-card{
      background:#5f381a;

      width:700px;
      height:650px;

      border-radius:15px;

      display:flex;
      justify-content:center;
      align-items:center;

      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    .register-card{
      background:#382b1b;

      width:400px;
      padding:35px;

      border-radius:10px;

      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .register-card h2{
      text-align:center;
    }

    .register-card input{
      padding:14px;

      border:none;
      outline:none;

      border-radius:5px;

      background:#5e462a;
      color:white;

      font-size:16px;
    }

    .register-card button{
      padding:14px;

      border:none;
      border-radius:5px;

      background:#b8804c;
      color:white;

      font-size:16px;

      cursor:pointer;
      transition:0.2s;
    }

    .register-card button:hover{
      opacity:0.8;
    }

  </style>
</head>

<body>

  <!-- BARRA SUPERIOR -->

  <div class="topbar">

    <div class="left">

      <div class="logo">STOAM</div>

      <div class="nav-links">
        <a href="#">TIENDA</a>
        <a href="#">BIBLIOTECA</a>
        <a href="perfil.html" class="active">PERFIL</a>
      </div>

    </div>

    <div class="search-area">
      <input type="text" class="search-box" placeholder="Buscar en la tienda">
      <button class="search-btn">🔍</button>
    </div>

  </div>

  <!-- REGISTER -->

  <div class="register-container">

    <div class="big-card">

      <div class="register-card">

        <h2>Registrarse</h2>

        <input type="text" placeholder="Usuario">

        <input type="text" placeholder="Nombre">

        <input type="text" placeholder="Apellido">

        <input type="text" placeholder="Correo">

        <input type="password" placeholder="Contraseña">

        <input type="password" placeholder="Confirmar Contraseña">

        <button>Registrarse</button>


      </div>

    </div>

  </div>

</body>
</html>
