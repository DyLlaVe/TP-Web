<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#80461B;
      color:white;
    }

    /* BARRA SUPERIOR */
    .topbar{
      background:#5f381a;
      height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 25px;
      border-bottom:1px solid #80461B;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#f54500;
    }

    .nav-links{
      display:flex;
      gap:35px;
      margin-left:30px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:20px;
      transition:0.2s;
    }

    .nav-links a:hover{
      color:#ec9a01;
    }

    .nav-links a:active{
      color:#ec9a01;
      text-decoration: underline;
    }

    .left{
      display:flex;
      align-items:center;
    }

    .search-area{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .search-box{
      background:#2a475e;
      border:none;
      outline:none;
      padding:12px 15px;
      width:280px;
      color:white;
      border-radius:3px;
      font-size:15px;
    }

    .search-btn{
      background:#66c0f4;
      border:none;
      color:white;
      width:45px;
      height:45px;
      border-radius:3px;
      cursor:pointer;
      font-size:18px;
    }

 
   
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="topbar">

    <div class="left">
      <div class="logo">STOAM</div>

      <div class="nav-links">
        <a href="#">TIENDA</a>
        <a href="#">BIBLIOTECA</a>
        <a href="perfil.html">PERFIL</a>
      </div>
    </div>

    <div class="search-area">
      <input type="text" class="search-box" placeholder="Buscar en la tienda">
      <button class="search-btn">🔍</button>
    </div>

  </div>
