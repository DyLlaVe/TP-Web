<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    } 

    body{
      background:#80461B;
      color:white;
    }

    /* BARRA SUPERIOR */

    header{
      background:#5f381a;
      height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 25px;
      border-bottom:1px solid #80461B;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#f54500;
    }

    .img-logo{
      width: 65px;
    }

    .left{
      display:flex;
      align-items:center;
    }

    .nav-links{
      display:flex;
      gap:35px;
      margin-left:30px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:20px;
      transition:0.2s;
    }

    .nav-links a:hover{
      color:#ec9a01;
    }

    .nav-links a.active{
      color:#ec9a01;
      text-decoration:underline;
    }

    /* BUSCADOR */

    .search-area{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .search-box{
      background:#5e462a;
      border:none;
      outline:none;

      padding:12px 15px;
      width:280px;

      color:white;
      border-radius:3px;
      font-size:15px;
    }

    .search-btn{
      background:#b8804c;
      border:none;

      color:white;

      width:45px;
      height:45px;

      border-radius:3px;

      cursor:pointer;
      font-size:18px;
    }

    /* LOGIN */

    .login-container{
      display:flex;
      justify-content:center;
      margin-top:60px;
    }

    .big-card{
      background:#5f381a;

      width:700px;
      height:450px;

      border-radius:15px;

      display:flex;
      justify-content:center;
      align-items:center;

      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    .login-card{
      background:#382b1b;

      width:400px;
      padding:35px;

      border-radius:10px;

      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .login-card h2{
      text-align:center;
    }

    .login-card input{
      padding:14px;

      border:none;
      outline:none;

      border-radius:5px;

      background:#5e462a;
      color:white;

      font-size:16px;
    }

    .login-card button{
      padding:14px;

      border:none;
      border-radius:5px;

      background:#b8804c;
      color:white;

      font-size:16px;

      cursor:pointer;
      transition:0.2s;
    }

    .login-card button:hover{
      opacity:0.8;
    }

    /* OLVIDASTE CONTRASEÑA */

    .forgot-password{
      text-align:center;
      margin-top:5px;
    }

    .forgot-password a{
      color:#f4ab66;
      text-decoration:none;
      font-size:14px;
    }

    .forgot-password a:hover{
      text-decoration:underline;
    }

    /* REGISTRARSE */
    .register{
      text-align:center;
      margin-top:5px;
    }

    .register a{
      color:#f4ab66;
      text-decoration:none;
      font-size:14px;
    }

    .register a:hover{
      text-decoration:underline;
    }

    footer{
        color: #5f381a;
        background-color: #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0px 20px;
    }
    footer img{
      width: 60px;
      margin: 0;
    }
    .footer-redes{
      text-align: center;
    }
    .footer-right{
      text-align: right;
      display: flex;
      gap: 20px;
    }
    footer a{
        color: #ffb199;
        text-decoration: none;
    }
    footer a:hover{
        text-decoration: underline;
    }

  </style>
</head>

<body>

  <!-- BARRA SUPERIOR -->

  <header>

    <section class="left">
      <img src="imagenes\logo-removebg-preview.png" alt="logo" class="img-logo"> 
      <div class="logo">GameCloude</div>

      <div class="nav-links">
        <a href="inicio.html">TIENDA</a>
        <a href="#">BIBLIOTECA</a>
        <a href="perfil.html" class="active">PERFIL</a>
      </div>
    </section>

    <div class="search-area">
      <input type="text" class="search-box" placeholder="Buscar en la tienda">
      <button class="search-btn">🔍</button>
    </div>

  </header>

  <!-- LOGIN -->

  <section class="login-container">

    <div class="big-card">

      <div class="login-card">

        <h2>Iniciar sesión</h2>

        <input type="text" placeholder="Usuario">

        <input type="password" placeholder="Contraseña">

        <button onclick="window.location.href='perfil-iniciado.html'">Entrar</button>

        <div class="forgot-password">
          <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="register">
          <a href="registrarse.html">¿No tienes cuenta? Registrate</a>
        </div>

      </div>

    </div>

  </section>

  <!-- FOOTER -->

  <footer>
    <img src="imagenes\logo-removebg-preview.png" alt="logo">
    <div class="footer-redes"><a href="#">Nuestras redes</a></div>
    <div class="footer-right"> 
        <a href="#">Contáctanos</a>
        <a href="#">Ayuda</a>
        <a href="#">Preguntas Frecuentes</a>
    </div>
  </footer>


</body>
</html>
