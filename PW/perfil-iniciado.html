<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil iniciado</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#80461B;
      color:white;
    }

    /* BARRA SUPERIOR */

    .topbar{
      background:#5f381a;
      height:70px;

      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:0 30px;
    }

    .left{
      display:flex;
      align-items:center;
    }

    .logo{
      font-size:30px;
      font-weight:bold;
      color:#f54500;
    }

    .nav-links{
      display:flex;
      gap:35px;
      margin-left:40px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:20px;
      transition:0.2s;
    }

    .nav-links a:hover{
      color:#ec9a01;
    }

    .nav-links a.active{
      color:#ec9a01;
      text-decoration:underline;
    }

    /* PERFIL */

    .profile-container{
      width:100%;
      min-height:calc(100vh - 70px);

      display:flex;
      justify-content:center;
      align-items:flex-start;

      padding:40px;
    }

    .profile-card{
      width:100%;
      max-width:1200px;

      background:#5f381a;

      border-radius:15px;

      padding:40px;

      display:flex;
      gap:40px;

      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    /* LADO IZQUIERDO */

    .profile-left{
      width:300px;

      background:#382c1b;

      border-radius:10px;

      padding:80px;

      text-align:center;
    }

    .avatar{
      width:150px;
      height:150px;

      border-radius:50%;

      background:#241f1a;

      margin:0 auto 20px auto;

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:60px;
    }

    .username{
      font-size:28px;
      margin-bottom:10px;
    }

    .status{
      color:#f4b666;
      font-size:15px;
    }
    
    .frase{
        color: aliceblue;
        font-size:10px ;
    }

    /* LADO DERECHO */

    .profile-right{
      flex:1;

      background:#382c1b;

      border-radius:10px;

      padding:30px;
    }

    .section-title{
      font-size:28px;
      margin-bottom:25px;

      border-bottom:2px solid #f4ab66;
      padding-bottom:10px;
    }

    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:25px;
    }

    .info-box{
      background:#724d26;

      padding:20px;

      border-radius:10px;
    }

    .info-box h3{
      margin-bottom:10px;
      color:#ffa844;
    }

    .info-box p{
      font-size:18px;
    }

    /* DESEADOS */

    .wishlist{
      margin-top:40px;
    }

    .wishlist-games{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:20px;
    }

    .game-card{
      background:#5e432a;

      border-radius:10px;

      overflow:hidden;
    }

    .game-card img{
      width:100%;
      height:170px;
      object-fit:cover;
    }

    .game-info{
      padding:15px;
    }

    .game-info h4{
      margin-bottom:10px;
    }

    .price{
      color:#f4b666;
      font-weight:bold;
    }

  </style>
</head>

<body>

  <!-- BARRA SUPERIOR -->

  <div class="topbar">

    <div class="left">

      <div class="logo">
        STOAM
      </div>

      <div class="nav-links">
        <a href="#">TIENDA</a>
        <a href="#">BIBLIOTECA</a>
        <a href="#" class="active">DyLlaVe</a>
      </div>

    </div>

  </div>

  <!-- PERFIL -->

  <div class="profile-container">

    <div class="profile-card">

      <!-- IZQUIERDA -->

      <div class="profile-left">
        <div class="avatar">
          👤
        </div>
        <div class="username">
          DyLlave
        </div>
        <div class="status">
          ● En línea
        </div>
        <div class="frase">
          "Yo voy donde me necesitan"
        </div>

      </div>

      <!-- DERECHA -->

      <div class="profile-right">

        <div class="section-title">
          Información personal
        </div>

        <div class="info-grid">

          <div class="info-box">
            <h3>Nombre</h3>
            <p>Dylan</p>
          </div>

          <div class="info-box">
            <h3>Apellido</h3>
            <p>Vega</p>
          </div>

          <div class="info-box">
            <h3>Teléfono</h3>
            <p>+54 11 1234-5678</p>
          </div>

          <div class="info-box">
            <h3>Verificación en 2 pasos</h3>
            <p>Activada ✅</p>
          </div>

        </div>

        <!-- LISTA DE DESEADOS -->

        <div class="wishlist">

          <div class="section-title">
            Lista de deseados
          </div>

          <div class="wishlist-games">

            <div class="game-card">

              <img src="imagenes\overwatch-section1-feature1.avif">

              <div class="game-info">
                <h4>Overwatch</h4>
                <div class="price">$29.99</div>
              </div>

            </div>

            <div class="game-card">

              <img src="imagenes\conterstrike1.6.avif">

              <div class="game-info">
                <h4>Counter Strike 1.6</h4>
                <div class="price">$49.99</div>
              </div>

            </div>

            <div class="game-card">

              <img src="imagenes\sonoftheforest.jpg">

              <div class="game-info">
                <h4>Son of the forest</h4>
                <div class="price">$19.99</div>
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
