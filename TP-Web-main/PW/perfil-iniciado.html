<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/perfil-iniciado.css">
  <title>Perfil iniciado</title>

</head>

<body>

  <!-- BARRA SUPERIOR -->

  <header>

    <div class="left">

      <img src="imagenes\logo-removebg-preview.png" alt="logo" class="img-logo"> 
      <div class="logo">GameCloude</div>

      <div class="nav-links">
        <a href="inicio.html">TIENDA</a>
        <a href="#">BIBLIOTECA</a>
        <a href="perfil-iniciado.html" class="active" id="nav-usuario"></a>
      </div>

    </div>

  </header>

  <!-- PERFIL -->

  <main>

    <section class="profile-card">

      <!-- IZQUIERDA -->

      <article class="profile-left">
        <div class="avatar">
          👤
        </div>
        <div class="username">
        </div>
        <div class="status">
          ● En línea
        </div>
        <div class="frase">
          "Yo voy donde me necesitan"
        </div>
        <div>
          <button id = "logout">Cerrar sesion</button>
        </div>

      </article>

      <!-- DERECHA -->

      <div class="profile-right">

        <div class="section-title">
          Información personal
        </div>

        <div class="info-grid">

          <div class="info-box">
            <h3>Nombre</h3>
            <p>Dylan</p>
          </div>

          <div class="info-box">
            <h3>Apellido</h3>
            <p>Vega</p>
          </div>

          <div class="info-box">
            <h3>Teléfono</h3>
            <p>+54 11 1234-5678</p>
          </div>

          <div class="info-box">
            <h3>Verificación en 2 pasos</h3>
            <p>Activada ✅</p>
          </div>

        </div>

        <!-- LISTA DE DESEADOS -->

        <div class="wishlist" id="wishlist-container"></div>

      </div>

    </section>

  </main>

  <!--  FOOTER  -->
  <footer>
    <img src="imagenes\logo-removebg-preview.png" alt="logo">
    <div class="footer-redes"><a href="#">Nuestras redes</a></div>
    <div class="footer-right"> 
        <a href="#">Contáctanos</a>
        <a href="#">Ayuda</a>
        <a href="#">Preguntas Frecuentes</a>
    </div>
  </footer>

  <script src="js/perfil-iniciado.js"></script>
</body>
</html>
