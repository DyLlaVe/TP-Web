<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/registrarse.css">
  <title>Perfil</title>


</head>

<body>

  <!-- BARRA SUPERIOR -->

  <header>

    <div class="left">

      <img src="imagenes\logo-removebg-preview.png" alt="logo" class="img-logo"> 
      <div class="logo">GameCloude</div>

      <div class="nav-links">
        <a href="inicio.html">TIENDA</a>
        <a href="#">BIBLIOTECA</a>
        <a href="perfil.html" class="active">PERFIL</a>
      </div>

    </div>

    <div class="search-area">
      <input type="text" class="search-box" placeholder="Buscar en la tienda">
      <button class="search-btn">🔍</button>
    </div>

  </header>

  <!-- REGISTER -->

  <main>

    <section class="big-card">

      <div class="register-card">

        <form id="formRegistro">

          <h2>Registrarse</h2>

          <input type="text" id="usuario" placeholder="Usuario">

          <input type="password" id="password" placeholder="Contraseña">

          <input type="email" id="email" placeholder="Email">

          <button type="submit">Registrarse</button>

          <button type="reset">Limpiar</button>

        </form>


      </div>

    </section>

  </main>

  <footer>
    <img src="imagenes\logo-removebg-preview.png" alt="logo">
    <div class="footer-redes"><a href="#">Nuestras redes</a></div>
    <div class="footer-right"> 
        <a href="#">Contáctanos</a>
        <a href="#">Ayuda</a>
        <a href="#">Preguntas Frecuentes</a>
    </div>
  </footer>

  <script src="js/registro.js"></script>
</body>
</html>
