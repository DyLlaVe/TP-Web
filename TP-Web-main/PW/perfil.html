<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/perfil.css">
  <title>Perfil</title>

</head>

<body>

  <!-- BARRA SUPERIOR -->

  <header>

    <section class="left">
      <img src="imagenes\logo-removebg-preview.png" alt="logo" class="img-logo"> 
      <div class="logo">GameCloude</div>

      <div class="nav-links">
        <a href="inicio.html">TIENDA</a>
        <a href="#">BIBLIOTECA</a>
        <a href="perfil.html" class="active">PERFIL</a>
      </div>
    </section>

    <div class="search-area">
      <input type="text" class="search-box" placeholder="Buscar en la tienda">
      <button class="search-btn">🔍</button>
    </div>

  </header>

  <!-- LOGIN -->

  <section class="login-container">

    <div class="big-card">

      <div class="login-card">

        <form id="formLogin">
        
            <h2>Iniciar sesión</h2>
        
            <input type="text" id="usuario" placeholder="Usuario">
        
            <input type="password" id="password" placeholder="Contraseña">
            
            <button type="submit"> Entrar </button>

            <button type="reset"> Limpiar </button>
          
            <div class="forgot-password">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </div>
          
            <div class="register">
                <a href="registrarse.html">¿No tienes cuenta? Registrate</a>
            </div>
          
        </form>
      
      </div>

    </div>
    <script src="js/login.js"></script>

  </section>

  <!-- FOOTER -->

  <footer>
    <img src="imagenes\logo-removebg-preview.png" alt="logo">
    <div class="footer-redes"><a href="#">Nuestras redes</a></div>
    <div class="footer-right"> 
        <a href="#">Contáctanos</a>
        <a href="#">Ayuda</a>
        <a href="#">Preguntas Frecuentes</a>
    </div>
  </footer>


</body>
</html>
